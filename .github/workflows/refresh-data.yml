# Nightly MPLADS data refresh.
#
# Reloads the MPLADS snapshot and re-runs risk scoring, so the dashboard's
# "Data last refreshed" figure stays true rather than frozen at whenever the
# data was last loaded by hand.
#
# WHY NOT VERCEL CRON: scoring embeds ~127,000 work descriptions with
# sentence-transformers and takes 15-20 minutes. Vercel Functions cap at 300s.
# GitHub Actions allows 6h per job, so the pipeline runs here and writes to the
# same Neon database the deployed API reads.
#
# TO MAKE THIS LIVE, one repository secret is required
# (Settings -> Secrets and variables -> Actions):
#
#   DATABASE_URL      required. The same Neon connection string the API uses.
#                     Get it with: vercel env pull
#
#   MPLADS_DATA_URL   optional. A URL serving a .zip of the MPLADS CSV
#                     snapshots. Set this once a live data source is available;
#                     without it the job uses the committed snapshot in
#                     data/snapshot/, which keeps the pipeline reproducible from
#                     a clone but re-scores the same data each night.
#
# Without DATABASE_URL the job SKIPS with an explanatory message rather than
# failing, so an unconfigured repository does not show a permanently red badge.

name: Refresh MPLADS data

on:
  schedule:
    # 19:30 UTC = 01:00 IST. Runs after the Indian working day so a refresh that
    # takes 20 minutes never overlaps a live demo or someone's browsing.
    - cron: "30 19 * * *"
  workflow_dispatch:

# Two refreshes writing to the same tables would race, exactly as happened once
# during development. Never run this concurrently with itself.
concurrency:
  group: mplads-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Load is ~2 min and scoring ~20 on a runner, over 246,765 works and
    # 270,934 payments. 60 was too close to that once the snapshot grew to both
    # Lok Sabha terms - a run killed at the limit leaves the data half-refreshed
    # and the dashboard unscored. Explicit rather than the 360 default so a
    # genuine hang still dies instead of burning the full allowance.
    timeout-minutes: 120

    steps:
      # v4/v5 target Node 20, which the runners now force onto Node 24 with a
      # deprecation warning. v7 targets a supported runtime, so runs stay clean.
      - uses: actions/checkout@v7

      - name: Check configuration
        id: config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MPLADS_DATA_URL: ${{ secrets.MPLADS_DATA_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Refresh skipped — not configured"
              echo ""
              echo "This workflow needs the \`DATABASE_URL\` repository secret before it can run."
              echo "Add it under Settings → Secrets and variables → Actions."
              echo ""
              echo "Skipping rather than failing so the repository does not show a red badge."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            if [ -n "$MPLADS_DATA_URL" ]; then
              echo "source=url" >> "$GITHUB_OUTPUT"
            else
              echo "source=snapshot" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: pip install -r data/requirements.txt

      - name: Fetch MPLADS data
        if: steps.config.outputs.configured == 'true'
        env:
          MPLADS_DATA_URL: ${{ secrets.MPLADS_DATA_URL }}
          SOURCE: ${{ steps.config.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p mplads-data
          if [ "$SOURCE" = "url" ]; then
            echo "Using MPLADS_DATA_URL"
            curl --fail --silent --show-error --location \
                 --max-time 600 --output snapshot.zip "$MPLADS_DATA_URL"
          else
            # No live source configured: use the snapshot committed to the repo.
            # This re-scores the same data rather than fetching anything new, but
            # keeps the pipeline reproducible from a clone alone.
            echo "Using committed snapshot in data/snapshot/ (no MPLADS_DATA_URL set)"
            cp "$(ls -1 data/snapshot/*.zip | tail -1)" snapshot.zip
          fi
          unzip -j -o snapshot.zip '*.csv' -d mplads-data
          ls -la mplads-data

      - name: Load data
        if: steps.config.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MPLADS_DATA_DIR: mplads-data
        run: python data/load_real_data.py

      - name: Score works
        if: steps.config.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # ~20 minutes: embeds 246,765 descriptions and then runs the cohort
        # detectors over 270,934 payments. Not hung.
        run: python data/scoring.py

      # A timeout, a cancellation or a dead runner never reaches the code that
      # closes the audit row, so the run would sit at 'running' forever and the
      # freshness line would keep quoting the last success as if nothing had
      # been attempted since. Record the death here instead.
      - name: Record a failed or cancelled run
        if: ${{ (failure() || cancelled()) && steps.config.outputs.configured == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn, conn.cursor() as cur:
              cur.execute(
                  """UPDATE data_refresh
                        SET status = 'failed', finished_at = now(),
                            notes = COALESCE(notes || ' | ', '') || %s
                      WHERE status = 'running'""",
                  [f"workflow did not complete: {os.environ['RUN_URL']}"],
              )
              print(f"Marked {cur.rowcount} run(s) failed.")
          conn.close()
          PY

      - name: Report result
        if: steps.config.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          cur.execute("""SELECT finished_at, rows_loaded, rows_scored, rows_rejected
                         FROM data_refresh WHERE status = 'success'
                         ORDER BY finished_at DESC LIMIT 1;""")
          row = cur.fetchone()
          print("### Refresh complete\n")
          if row:
              print(f"- Finished: {row[0]}")
              print(f"- Loaded: {row[1]:,}")
              print(f"- Scored: {row[2]:,}")
              print(f"- Rejected: {row[3]:,}")
          else:
              print("No successful run recorded — check the logs above.")
          conn.close()
          PY
